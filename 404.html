/* ══════════════════════════════════════════════════════════════════════
   BURN1NG CORE — ชุดธีมกลางแนว cyberpunk / redteam
   ทุกหน้าในเว็บใช้ชุดนี้ร่วมกัน  ไม่เพิ่มไฟล์  ไม่เพิ่ม request  ไม่เพิ่ม JS

   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* ชั้นพื้นหลัง มืด → สว่าง */
  --c-void:#04070E; --c-bg:#060B16; --c-elev:#0A1220; --c-surf:#101A2E;
  /* เส้นขอบ */
  --c-line:rgba(120,190,235,.17); --c-line-2:rgba(120,190,235,.32);
  /* ตัวอักษร */
  --c-ink:#EAF2FC; --c-ink-2:#B4C7DE; --c-ink-3:#8097B1;
  /* สีเน้นห้าตัว ใช้ค่าเดียวกันทั้งเว็บ */
  --c-cyan:#00E5FF; --c-mint:#2BE8B0; --c-red:#FF3D70;
  --c-violet:#9B7CFF; --c-gold:#FFB020; --c-blue:#4D9FFF; --c-orange:#FF8C42;
  --c-cyan-s:rgba(0,229,255,.13); --c-mint-s:rgba(43,232,176,.13);
  --c-red-s:rgba(255,61,112,.13); --c-violet-s:rgba(155,124,255,.14);
  --c-gold-s:rgba(255,176,32,.13);
  /* แสงและเงา */
  --c-glow:0 0 34px rgba(0,229,255,.22);
  --c-shadow:0 26px 64px rgba(0,0,0,.66);
  --c-shadow-sm:0 10px 26px rgba(0,0,0,.34);
  --c-grid-c:rgba(130,195,245,.055);
  --c-scan:rgba(190,230,255,.020);
  /* ฟอนต์สี่ตัว เรียกชื่อเดียวกันทุกหน้า */
  --f-brand:'Orbitron','Space Grotesk',system-ui,sans-serif;
  --f-disp:'Space Grotesk','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','Space Grotesk',system-ui,sans-serif;
  --f-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;
  /* รูปทรง มุมตัดล่างขวา 13px เป็นลายเซ็นร่วมของทุกหน้า */
  --c-cut:polygon(0 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%);
  --c-cut-lg:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%);
  --c-r:3px; --c-ease:cubic-bezier(.22,.68,.32,1);
  --c-raise:rgba(190,225,255,.07);      /* พื้นผิวยกขึ้นจากพื้นหลัง */
  --c-edge:rgba(190,225,255,.14);       /* เส้นขอบบางๆ */
  --c-on-accent:#04121A;                /* ตัวหนังสือบนป้ายสีเน้น */
  /* สีตัวหนังสือบนป้ายที่พื้นเป็นสีเน้นจางๆ  ชุดนี้ไว้ใช้บนพื้นมืด */
  --c-cyan-t:#7DD3FC; --c-mint-t:#6EE7C4; --c-red-t:#FF8CA6;
  --c-violet-t:#C4B0FF; --c-gold-t:#FDE047;
  /* ม่านทับภาพพื้นหลัง  ต้องเข้มพอให้ตัวหนังสืออ่านออกเสมอ */
  --c-scrim:linear-gradient(180deg,rgba(6,11,22,.55) 0%,rgba(6,11,22,.90) 100%);
}
/* ══ จานสีธีมสว่าง ══
   ทุกหน้าชี้ชื่อตัวแปรของตัวเองมาที่ --c-* อยู่แล้ว
   พอนิยามชุดสว่างตรงนี้ชุดเดียว ทั้งเว็บจึงพลิกธีมได้พร้อมกัน
   สีเน้นทุกตัวเลือกค่าที่ผ่านเกณฑ์คอนทราสต์ WCAG AA บนพื้นสว่างแล้ว */
html[data-theme="light"]{
  --c-void:#C9D6E8; --c-bg:#EDF2F9; --c-elev:#FFFFFF; --c-surf:#FFFFFF;
  --c-line:rgba(16,48,90,.17); --c-line-2:rgba(16,48,90,.30);
  --c-ink:#08121F; --c-ink-2:#334A69; --c-ink-3:#4F6480;
  --c-cyan:#006E93; --c-mint:#00704F; --c-red:#C6154A;
  --c-violet:#5231D2; --c-gold:#8A5000; --c-blue:#0B5FBF; --c-orange:#B04300;
  --c-cyan-s:rgba(0,110,147,.10); --c-mint-s:rgba(0,112,79,.10);
  --c-red-s:rgba(198,21,74,.09); --c-violet-s:rgba(82,49,210,.09);
  --c-gold-s:rgba(138,80,0,.11);
  --c-glow:0 0 0 1px rgba(0,110,147,.20);
  --c-shadow:0 20px 48px rgba(15,40,80,.14);
  --c-shadow-sm:0 8px 20px rgba(15,40,80,.08);
  --c-grid-c:rgba(16,60,120,.07);
  --c-scan:rgba(20,50,90,.014);
  --c-raise:rgba(10,30,60,.05);
  --c-edge:rgba(16,48,90,.16);
  --c-on-accent:#FFFFFF;
  /* บนพื้นสว่างต้องเข้มกว่าสีเน้นปกติ เพราะป้ายมีพื้นสีจางรองอยู่อีกชั้น */
  --c-cyan-t:#005068; --c-mint-t:#005C41; --c-red-t:#A8113E;
  --c-violet-t:#3F27A6; --c-gold-t:#6B3D00;
  --c-scrim:linear-gradient(180deg,rgba(237,242,249,.87) 0%,rgba(237,242,249,.96) 100%);
  color-scheme:light;
}
html[data-theme="dark"]{color-scheme:dark}

/* ชั้นพื้นหลังกลาง ธีมสว่างต้องเบามือกว่านี้มาก ไม่งั้นจอขาวจะดูสกปรก */
html[data-theme="light"] .cx-glow{
  background:
    radial-gradient(1100px 620px at 86% -10%,rgba(0,110,147,.10),transparent 66%),
    radial-gradient(900px 540px at -4% 6%,rgba(82,49,210,.09),transparent 64%),
    radial-gradient(760px 460px at 50% 104%,rgba(0,112,79,.07),transparent 70%);
}
html[data-theme="light"] .cx-beam{display:none}
html[data-theme="light"] .cx-vig{box-shadow:inset 0 0 160px rgba(20,45,80,.10), inset 0 1px 0 rgba(0,110,147,.22)}
html[data-theme="light"] .cx-card{
  background:
    linear-gradient(90deg,var(--c-cyan),var(--c-violet)) top left/100% 1px no-repeat,
    linear-gradient(158deg,rgba(0,110,147,.045),rgba(255,255,255,.92));
}

/* ══ ปุ่มสลับธีม หน้าตาและพฤติกรรมเดียวกันทุกหน้า ══ */
.cx-theme{margin:0 auto 14px;
  display:inline-flex;flex:none;align-items:stretch;
  border:1px solid var(--c-line-2);border-radius:2px;overflow:hidden;
  background:var(--c-elev);
}
.cx-theme button{
  -webkit-appearance:none;appearance:none;background:transparent;border:0;margin:0;
  cursor:pointer;color:var(--c-ink-3);font:inherit;line-height:0;
  padding:6px 9px;min-width:34px;min-height:30px;display:grid;place-items:center;
  transition:background .15s,color .15s;
}
.cx-theme button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.cx-theme button:hover{color:var(--c-ink)}
.cx-theme button[aria-pressed="true"]{background:var(--c-cyan);color:var(--c-on-accent)}
.cx-theme button:focus-visible{outline:2px solid var(--c-cyan);outline-offset:-2px}
.cx-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){.cx-theme button{transition:none}}


/* ─────────── ชั้นพื้นหลังกลาง เป็น element แยก จึงไม่ชนกับ CSS เดิมของหน้าไหน ───────────
   .cx-glow  เรืองแสงรัศมีสามจุด        z -3
   .cx-grid  ตารางเส้น + เส้นสแกน CRT   z -2
   .cx-beam  ลำแสงกวาดช้าๆ               z -2
   .cx-vig   ขอบจอมืด + เส้นเรืองบนสุด   z -1                                       */
.cx-glow,.cx-grid,.cx-beam,.cx-vig{position:fixed;pointer-events:none}
.cx-glow{
  inset:0; z-index:-3;
  background:
    radial-gradient(1100px 620px at 86% -10%,rgba(0,229,255,.16),transparent 66%),
    radial-gradient(900px 540px at -4% 6%,rgba(155,124,255,.18),transparent 64%),
    radial-gradient(760px 460px at 50% 104%,rgba(43,232,176,.10),transparent 70%);
}
.cx-glow.solid{background-color:var(--c-bg)}
.cx-grid{
  inset:-1px; z-index:-2;
  background:
    linear-gradient(var(--c-grid-c) 1px,transparent 1px),
    linear-gradient(90deg,var(--c-grid-c) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(135% 105% at 50% 0%,var(--c-on-accent) 28%,transparent 88%);
          mask-image:radial-gradient(135% 105% at 50% 0%,var(--c-on-accent) 28%,transparent 88%);
}
.cx-grid::after{
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(0deg,var(--c-scan) 0 1px,transparent 1px 3px);
}
.cx-beam{
  left:0; right:0; top:0; height:34vh; z-index:-2; will-change:transform;
  background:linear-gradient(180deg,transparent,rgba(0,229,255,.05) 52%,rgba(0,229,255,.095) 74%,transparent);
  animation:cx-sweep 16s linear infinite;
}
@keyframes cx-sweep{from{transform:translate3d(0,-36vh,0)}to{transform:translate3d(0,102vh,0)}}
.cx-vig{
  inset:0; z-index:-1;
  box-shadow:inset 0 0 180px rgba(0,0,0,.52), inset 0 1px 0 rgba(0,229,255,.24);
}

/* ─────────── สูตรการ์ดกลาง มุมตัดล่างขวา + รางสีซ้าย + เส้นนีออนบนสุด ─────────── */
.cx-card{
  position:relative;
  clip-path:var(--c-cut);
  background:
    linear-gradient(90deg,var(--c-cyan),var(--c-violet)) top left/100% 1px no-repeat,
    linear-gradient(158deg,rgba(0,229,255,.055),rgba(6,11,22,.74));
  border-left:2px solid var(--c-cyan);
  box-shadow:var(--c-shadow-sm);
  transition:transform .26s var(--c-ease),box-shadow .26s var(--c-ease);
}
.cx-card:hover{transform:translateY(-3px);box-shadow:var(--c-shadow-sm),0 0 30px rgba(0,229,255,.22)}

/* ─────────── ป้ายกำกับแบบ terminal ─────────── */
.cx-tag{
  font-family:var(--f-mono); font-size:.62rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--c-cyan);
  border:1px solid rgba(0,229,255,.42); background:var(--c-cyan-s);
  padding:.12rem .42rem; border-radius:2px;
}

/* ─────────── เส้นนีออนไหล ใช้ร่วมกันทุกหน้า ─────────── */
@keyframes cx-flow{from{background-position:0% 0}to{background-position:300% 0}}
.cx-rail{
  background:linear-gradient(90deg,var(--c-cyan),var(--c-violet),var(--c-red),var(--c-violet),var(--c-cyan));
  background-size:300% 100%;
  animation:cx-flow 9s linear infinite;
}

/* ─────────── ชื่อแบรนด์กระตุกเฉพาะตอนชี้ ไม่กระตุกตลอดจนอ่านไม่ออก ─────────── */
.cx-glitch{position:relative;display:inline-block}
.cx-glitch::before,.cx-glitch::after{
  content:attr(data-text); position:absolute; left:0; top:0; width:100%;
  opacity:0; pointer-events:none; transition:opacity .12s linear;
}
.cx-glitch::before{color:var(--c-red); transform:translateX(-2px)}
.cx-glitch::after {color:var(--c-cyan);transform:translateX(2px)}
.cx-glitch:hover::before,.cx-glitch:focus-visible::before{opacity:.8;animation:cx-g1 .5s steps(2,end) infinite}
.cx-glitch:hover::after, .cx-glitch:focus-visible::after {opacity:.8;animation:cx-g2 .5s steps(2,end) infinite}
@keyframes cx-g1{0%{clip-path:inset(4% 0 72% 0)}50%{clip-path:inset(58% 0 22% 0)}100%{clip-path:inset(28% 0 48% 0)}}
@keyframes cx-g2{0%{clip-path:inset(66% 0 12% 0)}50%{clip-path:inset(16% 0 64% 0)}100%{clip-path:inset(44% 0 34% 0)}}

/* ─────────── เคารพการตั้งค่าของผู้ใช้ ─────────── */
@media (prefers-reduced-motion:reduce){
  .cx-beam{display:none}
  .cx-rail{animation:none}
  .cx-glitch::before,.cx-glitch::after{display:none}
  .cx-card{transition:none}
  .cx-card:hover{transform:none}
}
@media (prefers-contrast:more){
  :root{--c-line:rgba(170,215,250,.45);--c-ink-3:#A8BCD2;--c-scan:transparent}
}
@media print{

}

<script>

(function(){var d=document.documentElement,t=null;

<script>
/* ปุ่มสลับธีม ชุดเดียวใช้ทุกหน้าในเว็บ
   ดักคลิกที่ document จึงไม่ผูกกับ id หรือตำแหน่งปุ่ม วางตรงไหนของหน้าก็ทำงาน */
(function(){
  var KEY='burn_theme', d=document.documentElement;
  function paint(t){
    d.setAttribute('data-theme',t);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute('content',t==='light'?'#EDF2F9':'#060B16');
    var b=document.querySelectorAll('[data-cx-theme]');
    for(var i=0;i<b.length;i++)
      b[i].setAttribute('aria-pressed',b[i].getAttribute('data-cx-theme')===t?'true':'false');
  }
  paint(d.getAttribute('data-theme')==='light'?'light':'dark');
  document.addEventListener('click',function(e){
    var n=e.target;
    while(n&&n!==document&&!(n.getAttribute&&n.getAttribute('data-cx-theme')))n=n.parentNode;
    if(!n||n===document)return;
    var t=n.getAttribute('data-cx-theme');
    paint(t);
    try{localStorage.setItem(KEY,t);localStorage.setItem('theme',t)}catch(x){}
  },false);
  /* เปิดหลายแท็บ เปลี่ยนธีมแท็บหนึ่ง แท็บอื่นเปลี่ยนตาม */
  addEventListener('storage',function(e){
    if(e.key===KEY&&(e.newValue==='light'||e.newValue==='dark'))paint(e.newValue);
  },false);
}());
</script>
</body>
</html>
