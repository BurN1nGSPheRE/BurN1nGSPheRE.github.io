.cx-theme{margin:0 auto 14px}

:root{

  --accent-red:var(--c-red);

  --text-main:var(--c-ink);

}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--f-body)}
body{
  background:var(--c-bg);
  color:var(--text-main);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:32px 16px;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    var(--c-scrim),
    url('./assets/bg-cyberpunk.webp') no-repeat center center;
  background-size:cover;
}
.card{
  width:100%;max-width:560px;text-align:center;
  background:var(--glass-bg,rgba(9,14,26,.78));
  border:1px solid rgba(0,255,204,.35);
  border-radius:28px;
  padding:44px 28px 36px;
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  box-shadow:0 25px 50px rgba(0,0,0,.75),0 0 30px rgba(0,255,204,.18);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:4px;
  background:linear-gradient(90deg,var(--accent-cyan),var(--accent-purple),var(--accent-red));
  box-shadow:0 0 16px var(--accent-cyan);
}
.code{
  font-family:var(--f-mono);font-size:4.4rem;font-weight:700;line-height:1;
  color:var(--accent-cyan);text-shadow:0 0 24px rgba(0,255,204,.45);letter-spacing:4px;
}
h1{font-size:1.25rem;font-weight:600;margin:14px 0 8px}
p{color:var(--text-sub);font-size:.92rem;line-height:1.6}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.links a{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;border-radius:14px;text-decoration:none;font-size:.88rem;font-weight:500;
  color:var(--text-main);background:var(--c-raise);
  border:1px solid var(--c-edge);transition:all .2s ease;
}
.links a:hover,.links a:focus-visible{
  color:var(--accent-cyan);border-color:var(--accent-cyan);
  background:rgba(0,255,204,.14);transform:translateY(-2px);outline:none;
}
.links a.primary{border-color:var(--accent-cyan);color:var(--accent-cyan);background:var(--c-cyan-s)}
.foot{
  margin-top:26px;padding-top:16px;border-top:1px solid var(--c-edge);
  font-family:var(--f-mono);font-size:.72rem;color:var(--text-muted);letter-spacing:.8px;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

html[data-theme="light"] .card{background:rgba(255,255,255,.92);box-shadow:var(--c-shadow)}
html[data-theme="light"] .links a{background:var(--c-raise);border-color:var(--c-edge)}

<script>

d.setAttribute('data-theme',t);}());

<script>

(function(){
  var KEY='burn_theme', d=document.documentElement;
  function paint(t){
    d.setAttribute('data-theme',t);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute('content',t==='light'?'#EDF2F9':'#060B16');
    var sw=document.querySelectorAll('[data-cx-toggle]');
    for(var i=0;i<sw.length;i++)sw[i].setAttribute('aria-checked',t==='light'?'true':'false');
    var b=document.querySelectorAll('[data-cx-theme]');
    for(var j=0;j<b.length;j++)
      b[j].setAttribute('aria-pressed',b[j].getAttribute('data-cx-theme')===t?'true':'false');
  }
  function cur(){return d.getAttribute('data-theme')==='light'?'light':'dark'}
  paint(cur());
  document.addEventListener('click',function(e){
    var n=e.target;
    while(n&&n!==document&&!(n.getAttribute&&(n.hasAttribute('data-cx-toggle')||n.getAttribute('data-cx-theme'))))n=n.parentNode;
    if(!n||n===document)return;
    var t=n.hasAttribute('data-cx-toggle')?(cur()==='light'?'dark':'light'):n.getAttribute('data-cx-theme');
    paint(t);
    try{localStorage.setItem(KEY,t);localStorage.setItem('theme',t)}catch(x){}
  },false);

  addEventListener('storage',function(e){
    if(e.key===KEY&&(e.newValue==='light'||e.newValue==='dark'))paint(e.newValue);
  },false);
}());
</script>
<script src="/assets/engine.js"></script>
